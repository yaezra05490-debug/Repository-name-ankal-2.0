<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>אנק״ל — ניהול מערכת</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
<style>
  /* הדף יושב על גיליון העיצוב של האתר, ומוסיף רק את מה שייחודי לו. */
  body{background:var(--bg);color:var(--text);font-family:var(--font)}
  .adm{max-width:1180px;margin:auto;padding:26px 22px 60px}
  .adm-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;color:#edf6ff}
  .adm-top .logo{color:#edf6ff}
  .adm-top .spacer{flex:1}
  .adm-who{display:flex;align-items:center;gap:9px;font-size:12px;color:#9badc3}
  .adm-who img{width:30px;height:30px;border-radius:9px;object-fit:cover}
  .gate{max-width:430px;margin:14vh auto;padding:30px;background:var(--card);border-radius:var(--radius);text-align:center}
  .gate h1{font:700 24px var(--display);margin:0 0 6px}
  .gate p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 20px}
  .crumbs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#9badc3}
  .crumbs button{border:0;background:transparent;color:var(--cyan);font:inherit;padding:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .panel h2{font:600 19px var(--display);margin:0 0 4px}
  .panel>p{color:var(--muted);font-size:13px;margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px;align-items:start}
  .u{display:flex;align-items:center;gap:11px;padding:13px;border:1px solid var(--line);border-right:3px solid hsl(var(--tint) 62% 55%);
     border-radius:13px;background:var(--card);text-align:right;width:100%;transition:.15s}
  .u:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(25,42,70,.1);border-right-color:hsl(var(--tint) 62% 48%)}
  .u-pic{flex:none;width:40px;height:40px;border-radius:12px;object-fit:cover;display:grid;place-items:center;
     font:700 16px var(--display);color:hsl(var(--tint) 58% 32%);background:hsl(var(--tint) 68% 92%)}
  .u-copy{min-width:0}
  .u-copy strong{display:block;font:600 14px var(--display);overflow-wrap:anywhere}
  .u-copy span{display:block;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
  .u-tag{margin-right:auto;flex:none;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;background:#ffe3e7;color:#a72f42}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:14px}
  .stat{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:13px}
  .stat b{display:block;font:700 23px var(--display)}
  .stat span{font-size:11px;color:var(--muted)}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal;max-width:420px;overflow-wrap:anywhere}
  th{background:var(--paper);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
  .muted{color:var(--muted);font-size:12px}
  .err{padding:13px;border-radius:11px;background:#ffe3e7;color:#a72f42;font-size:13px;margin-bottom:14px}
  .load{padding:40px;text-align:center;color:var(--muted)}
  .sub-h{font-size:14px;margin:22px 0 10px;color:var(--muted)}
  /* כפתור צף "למעלה": מופיע אחרי גלילה בטבלאות ארוכות */
  .to-top{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;width:46px;height:46px;border-radius:50%;border:0;background:var(--cyan-2,#10b9a7);color:#fff;font-size:22px;box-shadow:0 10px 26px rgba(2,8,23,.35);cursor:pointer;transition:.18s}
  .to-top[hidden]{display:none}.to-top:hover{transform:translateX(-50%) translateY(-2px)}
  .gate-mark{width:60px;height:60px;margin:0 auto 14px;border-radius:19px;display:grid;place-items:center;
    font-size:26px;background:hsl(172 60% 45% / .15)}
  .code-input{width:100%;padding:14px;border:2px solid var(--line);border-radius:13px;font:700 24px var(--display);
    text-align:center;letter-spacing:.4em;background:var(--paper);color:var(--text)}
  .code-input:focus{outline:0;border-color:var(--cyan-2);box-shadow:0 0 0 3px hsl(172 60% 45% / .16)}
  .linkish{border:0;background:transparent;color:var(--cyan);font:inherit;font-size:11px;padding:2px 6px;
    border-radius:7px;cursor:pointer}
  .linkish:hover{background:hsl(172 60% 45% / .16)}
  /* לשוניות: משתמשים, יומן, תקלות, סל. */
  .adm-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .adm-tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 13px var(--font);
    padding:8px 15px;border-radius:11px;cursor:pointer;transition:.15s}
  .adm-tabs button:hover{border-color:var(--cyan-2)}
  .adm-tabs button.active{background:hsl(172 60% 45% / .14);border-color:var(--cyan-2);color:var(--cyan-2)}
  .adm-tabs .refresh{margin-right:auto}
  /* לשונית השרת */
  .srv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:8px 0 18px}
  .srv-card{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:grid;gap:10px;align-content:start}
  .srv-card.current{border-color:var(--cyan-2);box-shadow:0 0 0 2px hsl(172 60% 45% / .2)}
  .srv-card h3{margin:0;font:700 17px var(--display)}
  .srv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  .srv-row .ok{color:#087455;font-weight:700}.srv-row .bad{color:#a72f42;font-weight:700}
  .srv-card .chip{display:inline-block;padding:4px 10px;border-radius:999px;background:hsl(172 60% 45% / .14);color:var(--cyan-2);font-size:12px;font-weight:700;width:max-content}
  .srv-config{padding:16px;border:1px dashed var(--line);border-radius:14px}
  .srv-config h3{margin:0 0 8px;font:700 15px var(--display)}
  .srv-config ul{margin:0 0 10px;padding-right:18px;line-height:1.8;font-size:13px}
  /* חיפוש מקומי בתוך כל מסך. */
  .adm-search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
    border-radius:11px;padding:0 12px;height:40px;margin-bottom:14px;color:var(--muted);max-width:420px}
  .adm-search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit}
  .toast{position:fixed;bottom:20px;right:20px;z-index:50;background:#162033;color:#fff;font-size:13px;
    padding:12px 16px;border-radius:12px;border-left:3px solid var(--cyan);box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .u-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .u-head .spacer{flex:1}
  .who-cell{display:flex;flex-direction:column;line-height:1.4}
  .who-cell b{font-weight:600}
  .who-cell small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="adm">
  <header class="adm-top">
    <span class="logo"><img src="/logo.png" alt="" width="32" height="32" style="border-radius:9px"><span>אנק״ל · ניהול</span></span>
    <span class="spacer"></span>
    <span class="adm-who" id="who"></span>
  </header>
  <main id="view"><div class="load">טוען…</div></main>
</div>

<script src="/config.js"></script>
<script src="/vcard.js"></script>
<script>
(() => {
  "use strict";
  const CFG = window.ANKAL_CONFIG || {};
  const view = document.getElementById("view");
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const FIELDS = ["name", "mobile", "home", "work", "fax", "email", "note"];
  const LABELS = { name: "שם", mobile: "נייד", home: "בית", work: "עבודה", fax: "פקס", email: "מייל", note: "הערה" };
  const TABS = [
    { key: "users", label: "משתמשים" },
    { key: "logs", label: "יומן פעולות" },
    { key: "errors", label: "תקלות" },
    { key: "trash", label: "סל מחזור" },
    { key: "server", label: "⚙ שרת" }
  ];
  /* היומן שומר קודי פעולה טכניים; כאן הם מתורגמים למשפט עברי שאומר מה קרה. */
  const ACTION_HE = {
    create_list: "יצירת רשימה חדשה", delete_list: "העברת רשימה לסל",
    import: "ייבוא קובץ אנשי קשר", export_vcf: "ייצוא קובץ VCF",
    export_xlsx: "ייצוא קובץ Excel", export_csv: "ייצוא קובץ CSV",
    download_app: "הורדת התוכנה למחשב",
    move_contacts: "העברת אנשי קשר בין רשימות", copy_contacts: "העתקת אנשי קשר בין רשימות"
  };
  const DEVICE_HE = { web: "אתר", desktop: "תוכנה" };

  let token = "";
  let me = null;
  const state = { tab: "users", stats: {}, items: [], total: 0, users: [], user: null, lists: [], list: null, q: "" };

  function fmtDate(v) {
    if (!v) return "—";
    try { return new Intl.DateTimeFormat("he-IL", { dateStyle: "short", timeStyle: "short" }).format(new Date(v)); }
    catch (_) { return String(v); }
  }
  function toast(message) {
    const el = document.createElement("div");
    el.className = "toast"; el.textContent = message;
    document.body.appendChild(el); setTimeout(() => el.remove(), 3500);
  }

  /* ── קוד כניסה ──
     שער נוח שמונע כניסה מקרית של מי שנתקל בכתובת. הוא אינו הגנה של ממש:
     הדף רץ בדפדפן, וכל מי שיפתח את קוד המקור יראה את קוד ברירת המחדל.
     ההגנה האמיתית היא בדיקת ADMIN_EMAIL בשרת, שרצה על כל בקשה בנפרד.
     קוד שהוחלף נשמר בדפדפן הזה בלבד — החלפה במחשב אחד לא משפיעה על אחר. */
  /* הקוד נשלח עם כל בקשה ונבדק בשרת (ADMIN_CODE); הדף עצמו לא מכיר אותו. נשמר לסשן הדפדפן בלבד. */
  let code = sessionStorage.getItem("yaezra.code") || "";

  /* צבע יציב לכל שם — אותה שיטה כמו באפליקציה, כדי ששני המסכים יראו כמו
     מערכת אחת ולא כמו שני מוצרים. */
  function hue(name) {
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.codePointAt(0)) % 360;
    return h;
  }
  function initial(name) { return [...String(name).trim().replace(/^["'׳״]+/, "")][0] || "?"; }

  async function api(action, payload = {}) {
    const res = await fetch(CFG.API_PATH, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, idToken: token, adminCode: code, payload })
    });
    const body = await res.json().catch(() => ({ ok: false, message: "תשובה לא תקינה מהשרת" }));
    if (!body.ok) throw new Error(body.message || body.error || "הפעולה נכשלה");
    return body.data;
  }

  /* ───────── כניסה ───────── */

  /* הכניסה: קוד הניהול בלבד. הוא נבדק בשרת עם הבקשה הראשונה (adminOverview), ובלי קוד נכון אין נתונים. */
  function renderCodeGate(message) {
    view.innerHTML = `<div class="gate">
      <div class="gate-mark">🔒</div>
      <h1>ניהול מערכת</h1>
      <p>הזינו את קוד הכניסה כדי להמשיך.</p>
      ${message ? `<div class="err">${esc(message)}</div>` : ""}
      <form id="code-form" autocomplete="off">
        <input id="code-input" class="code-input" type="password" inputmode="numeric" maxlength="12"
               placeholder="••••••" aria-label="קוד כניסה" autofocus>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:12px">המשך ←</button>
      </form>
    </div>`;
    const form = document.getElementById("code-form");
    const input = document.getElementById("code-input");
    input.focus();
    form.onsubmit = (event) => {
      event.preventDefault();
      code = input.value.trim();
      if (!code) return;
      signInWithCode();
    };
  }

  /* הבקשה הראשונה היא גם הבדיקה: אם השרת מחזיר נתונים, הקוד נכון. */
  async function signInWithCode() {
    view.innerHTML = `<div class="load">בודק את הקוד…</div>`;
    try {
      const data = await api("adminOverview", { tab: "users", limit: 500 });
      sessionStorage.setItem("yaezra.code", code);
      me = { name: "מנהל" };
      document.getElementById("who").innerHTML = `<span>מנהל</span><button class="linkish" id="sign-out">יציאה</button>`;
      document.getElementById("sign-out").onclick = () => { code = ""; sessionStorage.removeItem("yaezra.code"); renderCodeGate(""); };
      state.tab = "users"; cacheWrite("users", data); applyTabData("users", data); renderTab(); setFreshness(`עודכן ${fmtDate(new Date().toISOString())}`);
      if (statsNeeded(data)) { setFreshness("מחשב סטטיסטיקה ברקע…"); refreshStats(); }
    } catch (error) {
      code = ""; sessionStorage.removeItem("yaezra.code");
      renderCodeGate(/שגוי|ADMIN_ONLY/.test(error.message) ? "הקוד שגוי." : error.message);
    }
  }

  /* ───────── מעטפת: סטטיסטיקות + לשוניות ───────── */

  function statsHtml() {
    const s = state.stats || {};
    return `<div class="stats">
      <div class="stat"><b>${s.users ?? "—"}</b><span>משתמשים</span></div>
      <div class="stat"><b>${s.lists ?? "—"}</b><span>רשימות</span></div>
      <div class="stat"><b>${s.contacts ?? "—"}</b><span>אנשי קשר</span></div>
      <div class="stat"><b dir="ltr">${esc(s.storage ?? "—")}</b><span>נפח אחסון</span></div>
    </div>`;
  }
  function tabsHtml() {
    return `<div class="adm-tabs">
      ${TABS.map((t) => `<button data-tab="${t.key}" class="${state.tab === t.key ? "active" : ""}">${t.label}</button>`).join("")}
      <button class="refresh" data-tab="${esc(state.tab)}" title="טעינה מחדש">⟳ רענון</button>
    </div>`;
  }
  function searchHtml(placeholder) {
    return `<div class="adm-search"><span>⌕</span><input id="adm-q" type="search" placeholder="${esc(placeholder)}" value="${esc(state.q)}"></div>`;
  }
  function bindShell() {
    view.querySelectorAll("[data-tab]").forEach((el) => el.onclick = () => { state.q = ""; if (el.dataset.tab !== state.tab) state.limit = 0; openTab(el.dataset.tab); });
    const q = document.getElementById("adm-q");
    if (q) q.oninput = () => { state.q = q.value; renderTabContent(); };
  }

  /* ── בחירת השרת ──
     שני שרתים עם אותו חוזה ואותם נתונים: Google Apps Script והשרת בנטליפי. הבחירה נשמרת
     בלשונית "הגדרות" של הגיליון דרך הפעולה adminServerMode, שרצה תמיד בנטליפי. */
  const SERVER_HE = { script: "Google Apps Script", netlify: "Netlify", "script-fallback": "Google Apps Script (נפילה מנטליפי)" };
  async function pingServer(which) {
    const started = Date.now();
    try { const res = await fetch(CFG.API_PATH, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "ping", idToken: token, payload: { forceServer: which } }) }); const body = await res.json(); return { ok: Boolean(body.ok), ms: Date.now() - started, message: body.ok ? "" : (body.message || body.error || "") }; }
    catch (error) { return { ok: false, ms: Date.now() - started, message: error.message }; }
  }
  async function renderServerTab() {
    view.innerHTML = `${statsHtml()}${tabsHtml()}<div class="panel"><h2>השרת</h2><p id="tab-hint">בודק את שני השרתים…</p><div id="tab-content"><div class="load">טוען…</div></div></div>`;
    bindShell();
    const box = document.getElementById("tab-content"), hint = document.getElementById("tab-hint");
    let info = null, infoError = "";
    try { info = await api("adminServerMode", {}); } catch (error) { infoError = error.message; }
    const [script, netlify] = await Promise.all([pingServer("script"), pingServer("netlify")]);
    const mode = info ? info.mode : "script";
    const row = (label, ok, ms, message) => `<div class="srv-row"><b>${esc(label)}</b><span class="${ok ? "ok" : "bad"}">${ok ? "פעיל" : "לא זמין"}</span><span class="muted" dir="ltr">${ms} ms</span>${message ? `<small class="muted">${esc(message)}</small>` : ""}</div>`;
    hint.textContent = infoError ? "לא הצלחנו לקרוא את מצב השרת מהגיליון." : `הבקשות של כל המשתמשים עוברות כרגע דרך ${SERVER_HE[mode] || mode}.`;
    box.innerHTML = `
      <div class="srv-grid">
        <div class="srv-card ${mode === "script" ? "current" : ""}"><h3>Google Apps Script</h3>${row("מצב", script.ok, script.ms, script.message)}<p class="muted">השרת המקורי. גיבויים יומיים וניקוי סל המחזור רצים רק בו.</p>${mode !== "script" ? `<button class="btn btn-secondary" data-mode="script">העבר את המשתמשים לכאן</button>` : `<span class="chip">בשימוש</span>`}</div>
        <div class="srv-card ${mode === "netlify" ? "current" : ""}"><h3>Netlify</h3>${row("מצב", netlify.ok, netlify.ms, netlify.message)}<p class="muted">אותם נתונים (אותו גיליון ואותה תיקיית Drive) דרך חשבון שירות. מהיר יותר, ואם גוגל לא עונה הבקשות נופלות לבד לסקריפט.</p>${mode !== "netlify" ? `<button class="btn btn-primary" data-mode="netlify" ${netlify.ok ? "" : "disabled"}>העבר את המשתמשים לכאן</button>` : `<span class="chip">בשימוש</span>`}</div>
      </div>
      ${info ? `<div class="srv-config"><h3>הגדרת השרת בנטליפי</h3>
        <ul>
          <li>${info.serviceAccount ? "✓" : "✗"} מפתח חשבון שירות (GOOGLE_SA_JSON)${info.serviceAccountEmail ? ` — <span dir="ltr">${esc(info.serviceAccountEmail)}</span>` : ""}</li>
          <li>${info.adminEmail ? "✓" : "✗"} מייל המנהל (ADMIN_EMAIL)</li>
          <li>גיליון: <span dir="ltr">${esc(info.sheetId)}</span>${info.rootFolderId ? ` · תיקייה: <span dir="ltr">${esc(info.rootFolderId)}</span>` : " · התיקייה ANKAL_DATA מאותרת לפי שם"}</li>
          ${info.envMode ? `<li>⚠ ANKAL_SERVER_MODE=${esc(info.envMode)} במשתני הסביבה גובר על הבחירה כאן</li>` : ""}
          ${info.disabled ? "<li>⚠ SERVER_DISABLED=1 — השרת בנטליפי כבוי ממשתני הסביבה</li>" : ""}
        </ul>
        <p class="muted">כדי שנטליפי יגיע לנתונים: שתפו את הגיליון ואת תיקיית ANKAL_DATA ב-Drive עם כתובת חשבון השירות (הרשאת עריכה). הפרטים במדריך ההקמה, סעיף 11.</p></div>` : `<div class="err">${esc(infoError)}</div>`}`;
    box.querySelectorAll("[data-mode]").forEach((el) => el.onclick = async () => {
      const target = el.dataset.mode;
      if (!confirm(target === "netlify" ? "להעביר את כל המשתמשים לשרת בנטליפי? אם משהו לא יעבוד, הבקשות ייפלו לבד לסקריפט, ואפשר לחזור מכאן בכל רגע." : "לחזור ל-Google Apps Script?")) return;
      el.disabled = true;
      try { await api("adminServerMode", { mode: target }); toast("המצב עודכן. הבקשות הבאות יעברו דרך " + SERVER_HE[target]); renderServerTab(); }
      catch (error) { toast(error.message); el.disabled = false; }
    });
  }

  /* מטמון בדפדפן: לשונית שכבר נטענה מוצגת מיד מהעותק האחרון, והשרת (שלוקח כמה שניות) מרענן
     כשהוא עונה. בלי זה כל חזרה ללשונית הציגה "טוען…" על מסך ריק. */
  const CACHE_KEY = "yaezra.cache";
  function cacheRead(tab) { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "{}")[tab] || null; } catch (_) { return null; } }
  function cacheWrite(tab, data) { try { const all = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); all[tab] = { at: new Date().toISOString(), data }; localStorage.setItem(CACHE_KEY, JSON.stringify(all)); } catch (_) { } }
  function applyTabData(tab, data) { state.stats = data.stats || {}; state.items = data.items || []; state.total = data.total ?? state.items.length; if (tab === "users") state.users = state.items; }
  function setFreshness(text) { const el = document.getElementById("tab-fresh"); if (el) el.textContent = text; }
  const fmtBytes = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
  /* הסטטיסטיקה (סריקת דרייב של כל המשתמשים) מגיעה בבקשה נפרדת ברקע ומתמזגת למסך: שורת המספרים
     למעלה והמונים בכרטיסי המשתמשים. כך הלשונית עצמה חוזרת מיד. */
  let statsInFlight = null;
  function refreshStats() {
    if (statsInFlight) return statsInFlight;
    statsInFlight = (async () => {
      try {
        const s = await api("adminStats");
        state.stats = Object.assign({}, state.stats, s.stats || {}); delete state.stats.pending;
        const safe = (v) => String(v || "").replace(/[^A-Za-z0-9_-]/g, "");
        for (const u of state.users || []) { const mine = (s.perUser || {})[safe(u.sub)]; if (mine) Object.assign(u, { lists: mine.lists || 0, contacts: mine.contacts || 0, backups: mine.backups || 0, storage: fmtBytes(mine.bytes || 0) }); }
        if (state.users) cacheWrite("users", { stats: state.stats, items: state.users, total: state.users.length });
        const statsEl = view.querySelector(".stats"); if (statsEl) statsEl.outerHTML = statsHtml();
        if (state.tab === "users" && document.getElementById("tab-content")) renderTabContent();
        setFreshness(`עודכן ${fmtDate(new Date().toISOString())}`);
      } catch (_) { setFreshness("הסטטיסטיקה לא התקבלה — המספרים למעלה עשויים להיות חסרים"); }
      finally { statsInFlight = null; }
    })();
    return statsInFlight;
  }
  function statsNeeded(data) { return Boolean(data.stats?.pending) || (data.items || []).some((i) => i.sub && i.lists == null); }
  async function openTab(tab) {
    state.tab = tab; state.user = null; state.list = null;
    if (tab === "server") { view.innerHTML = `<div class="load">טוען…</div>`; return renderServerTab(); }
    const cached = cacheRead(tab);
    if (cached) { applyTabData(tab, cached.data); renderTab(); setFreshness(`מוצגים נתונים מ-${fmtDate(cached.at)} · מעדכן מהשרת…`); }
    else view.innerHTML = `<div class="load">טוען מהשרת…</div>`;
    try {
      const data = await api("adminOverview", { tab, limit: state.limit || 500 });
      if (state.tab !== tab) return; // עברו ללשונית אחרת בזמן ההמתנה
      cacheWrite(tab, data); applyTabData(tab, data); renderTab(); setFreshness(`עודכן ${fmtDate(new Date().toISOString())}`);
      if (statsNeeded(data)) { setFreshness("מחשב סטטיסטיקה ברקע…"); refreshStats(); }
    } catch (error) {
      if (state.tab !== tab) return;
      if (cached) setFreshness(`השרת לא ענה (${error.message}) — מוצגים הנתונים מ-${fmtDate(cached.at)}`);
      else view.innerHTML = `<div class="panel"><div class="err">${esc(error.message)}</div>
        <button class="btn btn-secondary" onclick="location.reload()">נסה שוב</button></div>`;
    }
  }

  function renderTab() {
    const meta = TABS.find((t) => t.key === state.tab) || TABS[0];
    view.innerHTML = `${statsHtml()}${tabsHtml()}
      <div class="panel">
        <h2>${esc(meta.label)}</h2>
        <p id="tab-fresh" class="muted" style="font-size:11px;margin:-4px 0 8px"></p>
        <p id="tab-hint"></p>
        ${searchHtml(state.tab === "users" ? "חיפוש לפי שם או מייל…" : "סינון…")}
        <div id="tab-content"></div>
      </div>`;
    bindShell();
    renderTabContent();
  }

  function filteredItems() {
    const q = state.q.trim().toLowerCase();
    if (!q) return state.items;
    return state.items.filter((item) => Object.values(item).some((v) => String(v ?? "").toLowerCase().includes(q)));
  }

  function renderTabContent() {
    const box = document.getElementById("tab-content");
    const hint = document.getElementById("tab-hint");
    if (!box) return;
    const items = filteredItems();
    const shown = state.items.length;
    const all = state.total ?? shown;
    const scope = shown >= all ? `כל ${all} הרשומות` : `${shown} מתוך ${all}`;
    if (hint) hint.textContent = state.q ? `${items.length} תוצאות מתוך ${shown}` :
      state.tab === "users" ? "לחצו על משתמש כדי לראות את הרשימות שלו." :
      state.tab === "logs" ? `${scope} — מהפעולה החדשה לישנה.` :
      state.tab === "errors" ? `${scope} — תקלות שדווחו מהמכשירים ומהשרת.` :
      "חשבונות שנמחקו — יימחקו סופית אחרי 30 יום. כניסה מחודשת של המשתמש מבטלת את המחיקה.";

    if (state.tab === "users") {
      box.innerHTML = `<div class="grid">${items.map(userCard).join("") || '<p class="muted">אין משתמשים להצגה.</p>'}</div>`;
      box.querySelectorAll("[data-sub]").forEach((el) => el.onclick = () => openLists(el.dataset.sub));
      return;
    }
    const columns =
      state.tab === "logs" ? [["at", "מתי"], ["who", "משתמש"], ["action", "פעולה"], ["listId", "רשימה"], ["device", "מכשיר"]] :
      state.tab === "errors" ? [["at", "מתי"], ["who", "משתמש"], ["area", "אזור"], ["message", "הודעה"]] :
      [["who", "משתמש"], ["deletedAt", "נמחק בתאריך"], ["status", "מצב"]];
    /* כל תא מוצג בצורה קריאה: תאריך עברי, פעולה במילים, מייל ביישור LTR
       (אחרת ה-@ מתהפך בעברית), ומזהה רשימה מקוצר עם המזהה המלא בריחוף. */
    const cellHtml = (key, item) => {
      const value = item[key];
      if (key === "at" || key === "deletedAt") return esc(fmtDate(value));
      if (key === "action") return esc(ACTION_HE[value] || value || "—");
      if (key === "device") return esc(DEVICE_HE[value] || value || "—");
      // שם המשתמש הוא הזיהוי; המייל מתחתיו בקטן ומיושר LTR כדי שה-@ לא יתהפך.
      if (key === "who") {
        const name = String(item.name || "").trim();
        const mail = String(item.email || "").trim();
        if (!name && !mail) return "—";
        return `<span class="who-cell"><b>${esc(name || mail)}</b>${name && mail ? `<small dir="ltr">${esc(mail)}</small>` : ""}</span>`;
      }
      if (key === "listId") return value ? `<span class="muted" dir="ltr" title="${esc(value)}">…${esc(String(value).slice(-6))}</span>` : "—";
      return esc(value || "—");
    };
    box.innerHTML = items.length ? `<div class="tbl-wrap"><table>
        <thead><tr>${columns.map(([, label]) => `<th>${esc(label)}</th>`).join("")}</tr></thead>
        <tbody>${items.map((item) => `<tr>${columns.map(([key]) =>
          `<td class="${key === "message" ? "wrap" : ""}">${cellHtml(key, item)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>${all > shown ? `<p style="margin-top:12px"><button class="btn btn-secondary" id="load-all">טען את כל ההיסטוריה (${all} רשומות)</button></p>` : ""}` : '<p class="muted">אין פריטים להצגה.</p>';
    // היומן נטען ב-500 שורות כדי שהלשונית תחזור מיד; "כל ההיסטוריה" מבקש הכול (עד 50,000)
    const loadAll = document.getElementById("load-all"); if (loadAll) loadAll.onclick = () => { state.limit = 50000; openTab(state.tab); };
  }

  function userCard(user) {
    const name = user.name || user.email || "ללא שם";
    const pic = user.picture
      ? `<img class="u-pic" src="${esc(user.picture)}" alt="" referrerpolicy="no-referrer">`
      : `<span class="u-pic">${esc(initial(name))}</span>`;
    return `<button class="u" style="--tint:${hue(name)}" data-sub="${esc(user.sub)}">
      ${pic}
      <span class="u-copy"><strong>${esc(name)}</strong><span dir="ltr">${esc(user.email || "")}</span>
        <span>נראה לאחרונה: ${esc(fmtDate(user.lastSeen))}</span>
        ${user.lists != null ? `<span class="u-counts">${user.lists} רשימות · ${(user.contacts || 0).toLocaleString("he")} אנשי קשר · ${user.backups || 0} גיבויי קיוליקס · ${esc(user.storage || "")}</span>` : ""}</span>
      ${user.blocked ? '<span class="u-tag">חסום</span>' : ""}
    </button>`;
  }

  /* ───────── הרשימות של משתמש ───────── */

  async function openLists(sub) {
    state.user = state.users.find((u) => String(u.sub) === String(sub)) || { sub };
    state.list = null;
    view.innerHTML = `<div class="load">טוען רשימות…</div>`;
    try {
      const data = await api("adminUserLists", { sub });
      state.lists = data.lists || []; state.backups = data.backups || [];
      const name = state.user.name || state.user.email || "משתמש";
      const totalContacts = state.lists.reduce((n, l) => n + (l.contacts || []).length, 0);
      const folderDate = (f) => { const m = /^(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})$/.exec(f); return m ? `${m[3]}.${m[2]}.${m[1]} ${m[4]}:${m[5]}` : f; };
      const CAT_HE = { phonebook: "אנשי קשר", callog: "שיחות", schedule: "לוח שנה", memo: "פתקים", playlist: "השמעה", udb: "חיזוי", settings: "הגדרות" };
      view.innerHTML = `
        ${crumbs([{ label: "משתמשים", go: "users" }, { label: name }])}
        <div class="panel">
          <div class="u-head">
            <h2>${esc(name)}</h2>
            <span class="spacer"></span>
            <button class="btn btn-secondary" id="block-btn">${state.user.blocked ? "ביטול חסימת סנכרון" : "חסימת סנכרון"}</button>
          </div>
          <p>${esc(state.user.email || "")} · ${state.lists.length} רשימות · ${totalContacts.toLocaleString("he")} אנשי קשר · ${state.backups.length} גיבויי קיוליקס בשרת · הצטרפות: ${esc(fmtDate(state.user.createdAt))}</p>
          <div class="grid">${state.lists.map((list) => `
            <button class="u" style="--tint:${hue(list.name)}" data-list="${esc(list.id)}">
              <span class="u-pic">${esc(initial(list.name || "רשימה"))}</span>
              <span class="u-copy"><strong>${esc(list.name || "ללא שם")}</strong>
                <span>${(list.contacts || []).length} אנשי קשר · עודכן ${esc(fmtDate(list.updatedAt))}</span></span>
            </button>`).join("") || '<p class="muted">למשתמש הזה אין רשימות.</p>'}
          </div>
          <h3 class="sub-h">גיבויי קיוליקס בשרת</h3>
          <div class="grid">${state.backups.map((b) => `
            <div class="u" style="--tint:${hue(b.folder)}">
              <span class="u-pic">☏</span>
              <span class="u-copy"><strong>${esc(folderDate(b.folder))}</strong><span dir="ltr">${esc(b.folder)}</span>
                <span>${b.files} קבצים · ${esc(b.storage || "")} · ${esc((b.categories || []).map((c) => CAT_HE[c] || c).join(", "))}</span></span>
            </div>`).join("") || '<p class="muted">אין גיבויים בשרת. גיבוי עולה מהתוכנה אחרי כניסה עם Google.</p>'}
          </div>
        </div>`;
      bindCrumbs();
      document.getElementById("block-btn").onclick = toggleBlock;
      view.querySelectorAll("[data-list]").forEach((el) => el.onclick = () => openList(el.dataset.list));
    } catch (error) {
      view.innerHTML = `${crumbs([{ label: "משתמשים", go: "users" }])}<div class="panel"><div class="err">${esc(error.message)}</div></div>`;
      bindCrumbs();
    }
  }

  /* חסימה עוצרת סנכרון בלבד: המשתמש ממשיך לעבוד מקומית ולייצא. */
  async function toggleBlock() {
    const blocking = !state.user.blocked;
    if (!confirm(blocking
      ? `לחסום את הסנכרון של ${state.user.email}? הם ימשיכו לעבוד מקומית, אבל שינויים לא יעלו לענן.`
      : `לבטל את החסימה של ${state.user.email}?`)) return;
    try {
      await api("adminToggleBlock", { sub: state.user.sub });
      state.user.blocked = blocking;
      const row = state.users.find((u) => String(u.sub) === String(state.user.sub));
      if (row) row.blocked = blocking;
      toast(blocking ? "הסנכרון נחסם" : "החסימה בוטלה");
      openLists(state.user.sub);
    } catch (error) { toast("הפעולה נכשלה: " + error.message); }
  }

  /* ───────── אנשי הקשר ברשימה ───────── */

  function openList(listId) {
    state.list = state.lists.find((l) => l.id === listId);
    if (!state.list) return;
    const contacts = state.list.contacts || [];
    const userName = state.user.name || state.user.email || "משתמש";
    const columns = FIELDS.filter((f) => contacts.some((c) => c[f]));
    view.innerHTML = `
      ${crumbs([{ label: "משתמשים", go: "users" }, { label: userName, go: "lists" }, { label: state.list.name }])}
      <div class="panel">
        <h2>${esc(state.list.name || "ללא שם")}</h2>
        <p>${contacts.length} אנשי קשר · של ${esc(userName)}</p>
        <div class="row-actions">
          <button class="btn btn-primary" data-x="vcf">⤓ ייצוא VCF</button>
          <button class="btn btn-secondary" data-x="csv">⤓ ייצוא CSV</button>
          <button class="btn btn-secondary" data-x="xlsx">⤓ ייצוא Excel</button>
        </div>
        <div class="adm-search" style="margin-top:15px"><span>⌕</span>
          <input id="list-q" type="search" placeholder="חיפוש בתוך הרשימה…"></div>
        <div class="tbl-wrap">
          <table>
            <thead><tr>${columns.map((f) => `<th>${esc(LABELS[f])}</th>`).join("")}</tr></thead>
            <tbody id="list-rows"></tbody>
          </table>
        </div>
        ${contacts.length ? "" : '<p class="muted" style="margin-top:12px">הרשימה ריקה.</p>'}
      </div>`;
    bindCrumbs();
    view.querySelectorAll("[data-x]").forEach((el) => el.onclick = () => exportList(el.dataset.x));
    const rows = document.getElementById("list-rows");
    const renderRows = (q) => {
      const query = String(q || "").trim().toLowerCase();
      const shown = query ? contacts.filter((c) => FIELDS.some((f) => String(c[f] || "").toLowerCase().includes(query))) : contacts;
      rows.innerHTML = shown.map((c) => `<tr>${columns.map((f) => `<td class="${f === "note" ? "wrap" : ""}">${esc(c[f] || "—")}</td>`).join("")}</tr>`).join("")
        || `<tr><td colspan="${columns.length}" class="muted">אין התאמות.</td></tr>`;
    };
    renderRows("");
    document.getElementById("list-q").oninput = (e) => renderRows(e.target.value);
  }

  /* ───────── ניווט ───────── */

  function crumbs(parts) {
    return `<div class="crumbs">${parts.map((p, i) => (i ? "<span>›</span>" : "") +
      (p.go ? `<button data-go="${p.go}">${esc(p.label)}</button>` : `<span>${esc(p.label)}</span>`)).join("")}</div>`;
  }
  function bindCrumbs() {
    view.querySelectorAll("[data-go]").forEach((el) => el.onclick = () => {
      if (el.dataset.go === "users") openTab("users");
      if (el.dataset.go === "lists") openLists(state.user.sub);
    });
  }

  /* ───────── ייצוא ───────── */

  function download(content, type, filename) {
    const blob = content instanceof Blob ? content : new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = filename;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  // תא שמתחיל ב-=,+,-,@ מתפרש באקסל כנוסחה. הגרש מנטרל את זה.
  function csvCell(value) {
    let text = String(value ?? "");
    if (/^[\s\t\r\n]*[=+\-@]/.test(text)) text = "'" + text;
    return `"${text.replace(/"/g, '""')}"`;
  }
  function safeName(value) { return String(value || "אנשי קשר").replace(/[\\/:*?"<>|]/g, "-").slice(0, 80); }

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "/xlsx.full.min.js";
      s.onload = resolve; s.onerror = () => reject(new Error("רכיב Excel לא נטען"));
      document.head.appendChild(s);
    });
  }

  async function exportList(format) {
    const contacts = state.list?.contacts || [];
    if (!contacts.length) return alert("אין אנשי קשר לייצוא");
    const base = safeName(`${state.user.name || state.user.email} - ${state.list.name}`);
    try {
      if (format === "vcf") {
        download(window.buildVcf(contacts), "text/vcard;charset=utf-8", base + ".vcf");
      } else if (format === "csv") {
        const lines = [FIELDS.map((f) => csvCell(LABELS[f])).join(","),
          ...contacts.map((c) => FIELDS.map((f) => csvCell(c[f])).join(","))];
        // BOM כדי שאקסל יזהה עברית ב-UTF-8.
        download("﻿" + lines.join("\r\n"), "text/csv;charset=utf-8", base + ".csv");
      } else {
        await loadXlsx();
        const rows = contacts.map((c) => Object.fromEntries(FIELDS.map((f) => [LABELS[f], c[f] || ""])));
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, XLSX.utils.json_to_sheet(rows), "אנשי קשר");
        XLSX.writeFile(book, base + ".xlsx");
      }
    } catch (error) {
      alert("הייצוא נכשל: " + error.message);
    }
  }

  /* ───────── התחלה ───────── */

  // כפתור צף "למעלה" — הטבלאות של רשימה גדולה ארוכות מאוד
  const toTop = document.createElement("button"); toTop.className = "to-top"; toTop.hidden = true; toTop.textContent = "↑"; toTop.title = "למעלה"; toTop.setAttribute("aria-label", "למעלה"); document.body.appendChild(toTop);
  window.addEventListener("scroll", () => { toTop.hidden = window.scrollY < 400; }, { passive: true });
  toTop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

  if (code) signInWithCode(); else renderCodeGate("");
})();
</script>
</body>
</html>
