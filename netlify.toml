[build]
  publish = "src"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # האתר לא אמור להיטען בתוך iframe של אתר אחר (הגנת clickjacking).
    # CSP מלא דורש התאמות ל-GTM ולכניסת Google, אבל frame-ancestors בטוח תמיד.
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"

[[redirects]]
  from = "/app"
  to = "/?app=1"
  status = 200

# ── אתר הניהול ──────────────────────────────────────────────────────────
# הכתובת שדרכה נכנסים. לשינוי — מחליפים את השורה הזו בלבד, והכתובת הישנה
# מפסיקה לעבוד מיד.
#
# שימו לב: המאגר בגיטהב ציבורי, ולכן הכתובת הזו גלויה לכל מי שיפתח את הקובץ
# שם. גם קוד הכניסה שבדף גלוי באותו אופן. שניהם נועדו למנוע כניסה מקרית,
# ואינם הגנה של ממש. ההגנה האמיתית היא בדיקת ADMIN_EMAIL ב-Apps Script,
# שרצה בשרת על כל בקשה: בלי חשבון המנהל לא יוצג שום נתון, גם למי שיודע את
# הכתובת ואת הקוד.
[[redirects]]
  from = "/a9d227cd70ffbc2b"
  to = "/YAEZRA/index.html"
  status = 200

# הנתיב הגלוי חסום, כדי שהכתובת שלמעלה תהיה הדרך היחידה להגיע לדף.
# force = true גובר על הקובץ הסטטי שיושב שם.
[[redirects]]
  from = "/YAEZRA/*"
  to = "/404.html"
  status = 404
  force = true

